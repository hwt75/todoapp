# Runs the checks that used to run only when someone remembered.
#
# The build is included, not just the tests: this project's riskiest failure is a
# service worker that does not compile or does not get emitted, and that is
# invisible to Vitest. `npm run build` is what proves /sw.js exists at all.
#
# `db-tests` is the other half of that same problem. The rules that decide days, money and
# chains live in plpgsql, not TypeScript — `npm test` cannot reach any of it, and every file
# under `supabase/tests/` was, until now, run only by whoever remembered to reset a local
# stack and feed each one through psql by hand (`supabase/tests/README.md`'s own account of
# why these files exist at all: nine of ten Epic 2 stories had a "verified end to end"
# paragraph and no command anyone could run again). This job is that command, run on every
# push instead of on whoever's memory.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # So a run can be retried without an empty commit — GitHub refuses to retry some
  # failed runs, and the only other way back to a green signal is polluting history.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # No VAPID key is set here on purpose. The build must succeed without one —
      # the key is a deploy-time value, and a build that needs a secret to compile
      # would mean the secret had leaked into the bundle.
      - name: Build
        run: npm run build

      - name: Service worker was emitted
        run: test -f public/sw.js || (echo "public/sw.js missing — the push channel would be dead" && exit 1)

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Only the database itself is needed to run migrations and psql against it — Studio,
      # Storage, Realtime, Auth, the edge runtime and the rest of the stack exist for the app
      # to talk to, and this job never does. Excluding them is what keeps this fast rather
      # than pulling and booting a dozen images to run raw SQL.
      - name: Start the database
        run: >
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply every migration from scratch
        run: supabase db reset

      # Every file rolls back its own transaction (`supabase/tests/README.md`), so running
      # them in one loop against one reset database is safe — nothing from an earlier file
      # persists into the next one.
      #
      # What they do not all share is the clock. A file driving a function that reads `now()`
      # cannot run at every hour: it builds its fixtures by subtracting from the real clock and
      # needs headroom on both sides, so it refuses outright outside its window.
      # `3-2-focus-prompt.sql` is the one such file today, and pushes land at any hour — before
      # this, a change touching no SQL at all went red for nothing but the time of day it was
      # pushed. So a file with a window declares it, as `-- ci-clock-window: <from>-<to> <tz>`,
      # and is skipped here outside it — loudly, because a green tick on a partial suite is only
      # honest if the reader is told. `lib/sql-clock-window.test.ts` holds each declared window to
      # the `raise` its file actually carries, so the two cannot drift apart unnoticed.
      - name: Run every file under supabase/tests/
        run: |
          set -e
          skipped=''
          for f in supabase/tests/*.sql; do
            # `<from> <to> <tz>`, or empty for the files that do not care what time it is.
            window=$(sed -n 's/^-- ci-clock-window: \([0-9]\{1,2\}\)-\([0-9]\{1,2\}\) \(.*\)$/\1 \2 \3/p' "$f" | head -1)
            if [ -n "$window" ]; then
              # `set --` splits without a subshell, so the three parts survive into the branch.
              # shellcheck disable=SC2086
              set -- $window
              from=$1 to=$2 tz=$3
              # A shell with no tzdata does not report an unknown zone — it silently answers in
              # UTC, which for this window is seven hours off and would skip the middle of the
              # working day while running the file at midnight. Refuse rather than decide on a
              # number that looks fine and is wrong.
              if [ ! -f "/usr/share/zoneinfo/$tz" ]; then
                echo "::error file=$f::Cannot resolve the timezone '$tz' — /usr/share/zoneinfo/$tz is missing, and TZ would fall back to UTC without saying so. Install tzdata on this runner; deciding the clock window on a UTC hour would be wrong by this zone's whole offset."
                exit 1
              fi
              # Read per file, immediately before running it. The loop takes minutes, and a window
              # edge crossed mid-run would otherwise skip a file that could still run, or run one
              # that could not. If the edge falls in the second between this line and psql, the
              # file's own `raise` still catches it and the job goes red — which is the honest
              # outcome, and exactly what was happening on every push after 20:00 before this.
              hour=$(TZ="$tz" date +%-H)
              if [ "$hour" -lt "$from" ] || [ "$hour" -gt "$to" ]; then
                echo "::warning file=$f::Skipped — this file drives an hourly gate through the real clock and needs ${from}:00-${to}:59 $tz, but it is ${hour}:xx there now. Nothing about it is broken; re-run this job inside that window to cover it."
                skipped="$skipped $f"
                continue
              fi
            fi
            echo "::group::$f"
            docker exec -i supabase_db_todoapp psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
            echo "::endgroup::"
          done
          # A green tick on a partial suite is worth exactly as much as the reader knowing it was
          # partial, so say so where the reader is — the run summary, not only the log.
          if [ -n "$skipped" ]; then
            {
              echo "### Database checks ran on less than the full suite"
              echo
              echo "These files were skipped for being outside the wall-clock window they declare:"
              for f in $skipped; do echo "- \`$f\`"; done
              echo
              echo "Re-run this job inside that window before reading the green tick as full coverage."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "NOT the full suite — skipped:$skipped"
          fi

      # Transactional SQL files intentionally use one session and roll back. This harness uses
      # two real psql sessions so each winner order proves the losing RPC waits on the shared
      # per-account advisory lock before it re-reads current Penalty state.
      - name: Run the current-Penalty collection race
        run: node scripts/test-current-penalty-race.mjs

      # Same reason, one lock down: the gap between the enqueue's claimed-day check and its insert
      # is only reachable from a second session, and it is where a reminder for an already-claimed
      # day came from.
      - name: Run the due-time reminder race
        run: node scripts/test-due-reminder-race.mjs
